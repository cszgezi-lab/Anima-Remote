name: anima-remote

services:
  anima-remote:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ${ANIMA_IMAGE:-anima-remote:local}
    container_name: ${ANIMA_CONTAINER_NAME:-anima-remote}
    restart: unless-stopped
    init: true
    # Match the Linux owner of deploy/data (normally the first Ubuntu user).
    # The container process remains non-root.
    user: "${ANIMA_UID:-1000}:${ANIMA_GID:-1000}"
    environment:
      NODE_ENV: production
      ANIMA_HOST: 0.0.0.0
      ANIMA_PORT: "8000"
      ANIMA_DATA_ROOT: /var/lib/anima
      ANIMA_HISTORY_LIMIT: "${ANIMA_HISTORY_LIMIT:-20}"
      ANIMA_CORS_ORIGINS: "${ANIMA_CORS_ORIGINS:-null,tauri://localhost,https://tauri.localhost}"
      ANIMA_OUTBOUND_ALLOWLIST: "${ANIMA_OUTBOUND_ALLOWLIST:-provider.example}"
      ANIMA_OUTBOUND_ALLOW_HTTP: "${ANIMA_OUTBOUND_ALLOW_HTTP:-false}"
      ANIMA_OUTBOUND_ALLOW_PRIVATE: "${ANIMA_OUTBOUND_ALLOW_PRIVATE:-false}"
      ANIMA_JSON_LIMIT: "${ANIMA_JSON_LIMIT:-10mb}"
      ANIMA_REQUEST_TIMEOUT_MS: "${ANIMA_REQUEST_TIMEOUT_MS:-30000}"
      ANIMA_LOG_LEVEL: "${ANIMA_LOG_LEVEL:-info}"
    ports:
      # This is the host-side bind.  Keep it on loopback when Tailscale Serve
      # terminates HTTPS; never change the default to 0.0.0.0 casually.
      - "${ANIMA_BIND_IP:-127.0.0.1}:${ANIMA_PORT:-18000}:8000/tcp"
    volumes:
      - type: bind
        source: ./deploy/data
        target: /var/lib/anima
        read_only: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/anima-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
